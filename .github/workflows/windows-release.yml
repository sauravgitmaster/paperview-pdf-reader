name: Build Windows app

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install app and packaging tools
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Build PaperView.exe
        run: python -m PyInstaller --noconfirm --clean --windowed --onefile --name PaperView --collect-all fitz --collect-all pymupdf PaperView.py

      - name: Publish downloadable Windows app
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        shell: pwsh
        run: gh release create $env:TAG_NAME dist/PaperView.exe --repo $env:GITHUB_REPOSITORY --title "PaperView $env:TAG_NAME" --generate-notes
